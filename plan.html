<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f6f4f2">
<title>Cuatrouno · Plan</title>
<!--
  Plantilla única del plan del alumno.
  Se dibuja a partir del JSON guardado en student_plans.data (ver shared/plan-import.js para el formato).
  La app principal (index.html) la carga en un iframe y le manda el plan por postMessage:
    { type:'cuatrouno:plan', plan, student }      -> dibuja / redibuja el plan
    { type:'cuatrouno:session', access_token, refresh_token } -> habilita guardar pesos en Progreso
  Con ?preview=1 (vista previa del admin) no muestra splash ni botón Salir.
-->
<style>
@font-face{
  font-family:'Switzer';
  src:url('/Switzer/Switzer-Variable.ttf') format('truetype');
  font-weight:100 900;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'Switzer';
  src:url('/Switzer/Switzer-VariableItalic.ttf') format('truetype');
  font-weight:100 900;font-style:italic;font-display:swap;
}
:root{
  --bg:#f6f4f2;
  --surface:#ffffff;
  --surface-alt:#fbf9f7;
  --line:rgba(23,18,15,.08);
  --line-strong:rgba(23,18,15,.14);
  --ink:#1a1512;
  --muted:#6b625c;
  --soft:#a39992;
  --red:#c81e1e;
  --red-bright:#ff5a48;
  --red-deep:#7a1010;
  --red-dim:rgba(200,30,30,.08);
  --grad-red:linear-gradient(135deg,var(--red-bright),var(--red) 55%,var(--red-deep));
  --good:#1f9d55;
  --good-dim:rgba(31,157,85,.10);
  --warn:#b9740a;
  --warn-dim:rgba(185,116,10,.10);
  --radius-lg:22px;
  --radius-pill:999px;
  --shadow-card:0 10px 28px rgba(23,18,15,.06), 0 2px 6px rgba(23,18,15,.04);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Switzer',sans-serif;font-weight:500;
  font-size:16px;line-height:1.5;
  padding-bottom:100px;
  -webkit-font-smoothing:antialiased;
  position:relative;
}

/* ambient */
.glow-field{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 800px 500px at 15% -10%, rgba(200,30,30,.07), transparent 60%),
    radial-gradient(ellipse 600px 400px at 100% 10%, rgba(255,90,72,.06), transparent 60%);
}
header,.hero,.tab-pane,nav.bottom{position:relative;z-index:1}

/* header */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 14px;
  border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;
  background:rgba(246,244,242,.82);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.brand-logo{height:36px;width:auto;display:block}

/* greeting row (saludo + foto) */
.greet-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px 0;
}
.greet-text .greet-hi{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.greet-text .greet-sub{font-size:13px;color:var(--muted);margin-top:2px}
.greet-avatar{
  width:46px;height:46px;border-radius:50%;
  object-fit:cover;flex-shrink:0;
  border:2px solid var(--surface);
  box-shadow:0 6px 16px rgba(23,18,15,.14);
}
.greet-avatar-fallback{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;
  background:var(--grad-red);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:15px;
  box-shadow:0 6px 16px rgba(200,30,30,.28);
}

/* hero */
.hero{padding:16px 20px 22px}
.hero-greet{font-size:13px;color:var(--muted);margin-bottom:4px}
.hero-label{
  font-size:11px;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--red);margin-bottom:8px;
}
.hero h1{
  font-family:'Switzer',sans-serif;font-weight:800;
  font-size:27px;line-height:1.15;letter-spacing:-.02em;margin-bottom:8px;
}
.hero h1 span{
  background:var(--grad-red);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{font-size:13px;color:var(--muted);line-height:1.6}

/* feature card (AI pick style) */
.feature-card{
  margin:18px 20px 0;border-radius:24px;overflow:hidden;
  color:#fff;position:relative;min-height:260px;
  background-image:url('/shared/hoy-toca-bg.webp');
  background-size:cover;background-position:center 30%;
  box-shadow:0 16px 36px rgba(23,18,15,.22);
  padding:18px;display:flex;flex-direction:column;justify-content:space-between;
}
.feature-card::before{
  content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(to top, rgba(10,7,6,.88) 0%, rgba(10,7,6,.45) 48%, rgba(10,7,6,.08) 78%);
}
.feature-tag{
  position:relative;z-index:1;align-self:flex-start;
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.22);backdrop-filter:blur(6px);
  padding:6px 12px;border-radius:var(--radius-pill);
  font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
}
.feature-content{position:relative;z-index:1;margin-top:auto}
.feature-card h3{font-size:19px;font-weight:800;margin-bottom:6px;letter-spacing:-.01em}
.feature-card p{font-size:12.5px;color:rgba(255,255,255,.88);line-height:1.5;margin-bottom:12px}
.feature-meta{display:flex;align-items:center;gap:14px;font-size:12px;font-weight:700}

/* watermark */
.watermark{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.watermark img{width:80vw;max-width:480px;opacity:.10;filter:brightness(0)}

/* bottom nav — floating rounded bar with center FAB */
.nav-wrap{
  position:fixed;left:14px;right:14px;bottom:14px;z-index:50;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.bottom{
  position:relative;
  background:rgba(255,255,255,.92);
  border:1px solid var(--line);
  border-radius:26px;
  display:flex;align-items:center;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 12px 32px rgba(23,18,15,.12);
  padding:6px 6px;
}
nav.bottom button{
  flex:1;background:none;border:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:9px 2px 8px;
  color:var(--soft);cursor:pointer;transition:color .15s;
  font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
}
nav.bottom button .icon{font-size:17px;line-height:1;position:relative;display:inline-block}
.nav-dot{position:absolute;top:-3px;right:-7px;width:7px;height:7px;border-radius:50%;background:var(--warn);display:none}
.nav-dot.show{display:block}
nav.bottom button.active{color:var(--red)}

/* whatsapp fab */
.wa-fab{position:fixed;right:16px;bottom:92px;z-index:60;display:flex;align-items:center;text-decoration:none}
.wa-bubble{
  background:#fff;color:var(--ink);font-size:11.5px;font-weight:700;line-height:1.35;
  padding:9px 13px;border-radius:15px;border-bottom-right-radius:4px;
  box-shadow:0 8px 22px rgba(23,18,15,.16);margin-right:10px;white-space:nowrap;
  animation:waBubbleIn .4s ease both, waBubbleOut .4s ease 5s forwards;
}
@keyframes waBubbleIn{from{opacity:0;transform:translateY(6px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes waBubbleOut{to{opacity:0;transform:translateY(4px) scale(.92)}}
.wa-avatar-wrap{
  position:relative;width:56px;height:56px;border-radius:50%;flex:none;
  background:#25D366;padding:3px;box-shadow:0 10px 26px rgba(37,211,102,.45);
  animation:waPulse 2.4s ease-in-out infinite;
}
@keyframes waPulse{0%,100%{box-shadow:0 10px 26px rgba(37,211,102,.45)}50%{box-shadow:0 10px 32px rgba(37,211,102,.7)}}
.wa-avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid #fff}
.wa-badge{
  position:absolute;bottom:-2px;right:-2px;width:21px;height:21px;border-radius:50%;
  background:#25D366;border:2px solid #fff;display:flex;align-items:center;justify-content:center;
}
.wa-badge svg{width:12px;height:12px;fill:#fff}

/* tabs */
.tab-pane{display:none;padding:22px 20px 20px;animation:fade .2s ease}
.tab-pane.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* typography */
.section-title{font-family:'Switzer',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.01em;margin-bottom:4px}
.section-title span{color:var(--red)}
.section-lead{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6}
.block-label{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:22px 0 10px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.stat{
  background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:14px 14px 12px;box-shadow:var(--shadow-card);
}
.stat.hi{border-color:transparent;background:var(--grad-red);box-shadow:0 12px 28px rgba(200,30,30,.28)}
.stat-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.stat.hi .stat-label{color:rgba(255,255,255,.8)}
.stat-val{font-family:'Switzer',sans-serif;font-weight:800;font-size:25px;letter-spacing:-.02em;color:var(--ink)}
.stat-val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.stat.hi .stat-val{color:#fff}
.stat.hi .stat-val small{color:rgba(255,255,255,.8)}

/* cards */
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:16px;margin-bottom:8px;
  box-shadow:var(--shadow-card);
}
.card.flush{padding:0;overflow:hidden}

/* rules */
.rule{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink);line-height:1.5}
.rule:last-child{border:none;padding-bottom:0}
.rule-dot{width:7px;height:7px;background:var(--grad-red);border-radius:50%;flex-shrink:0;margin-top:8px}
.rule b{color:var(--red);font-weight:700}

/* schedule */
.schedule{width:100%;border-collapse:collapse;font-size:14px}
.schedule tr{border-bottom:1px solid var(--line)}
.schedule tr:last-child{border:none}
.schedule td{padding:11px 0;vertical-align:top}
.schedule td:first-child{font-weight:800;color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em;width:40px;padding-right:12px;padding-top:13px}

/* tip */
.tip{background:var(--red-dim);border:1px solid rgba(200,30,30,.16);padding:13px 15px;border-radius:16px;margin:12px 0;font-size:13px;line-height:1.6;color:var(--muted)}
.tip b{display:block;color:var(--red);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}

.coord-banner{
  background:var(--grad-red);color:#fff;
  padding:12px 16px;border-radius:14px;margin-bottom:10px;
  font-size:13px;font-weight:800;letter-spacing:.01em;text-align:center;
  box-shadow:0 8px 22px rgba(200,30,30,.32);
  animation:coordPulse 2.2s ease-in-out infinite;
}
@keyframes coordPulse{0%,100%{box-shadow:0 8px 22px rgba(200,30,30,.32)}50%{box-shadow:0 8px 26px rgba(200,30,30,.55)}}

/* promo banner */
.promo-banner{
  display:block;margin:18px 0 4px;border-radius:18px;overflow:hidden;
  box-shadow:0 10px 26px rgba(23,18,15,.14);
  transition:transform .15s;
}
.promo-banner:active{transform:scale(.98)}
.promo-banner img{display:block;width:100%;height:auto}

/* meals */
.meal{border-bottom:1px solid var(--line)}
.meal:last-child{border:none}
.meal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 0;cursor:pointer;user-select:none;gap:12px}
.meal-name{font-size:15px;font-weight:700;flex:1}
.meal-num{color:var(--red);margin-right:6px;font-family:'Switzer',sans-serif;font-weight:800}
.meal-time{font-size:12px;color:var(--soft);white-space:nowrap}
.meal-kcal{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-alt);border:1px solid var(--line-strong);padding:4px 10px;border-radius:var(--radius-pill);white-space:nowrap}
.meal-chevron{color:var(--soft);font-size:12px;transition:transform .2s;flex-shrink:0}
.meal.open .meal-chevron{transform:rotate(180deg)}
.meal-body{display:none;padding-bottom:16px}
.meal.open .meal-body{display:block}
.meal-macros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.meal-tag{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-alt);border:1px solid var(--line);padding:4px 10px;border-radius:var(--radius-pill)}
.meal-tag b{color:var(--ink)}
.items{list-style:none}
.items li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink)}
.items li:last-child{border:none;padding-bottom:0}
.items li .qty{font-size:12px;font-weight:700;color:var(--red);white-space:nowrap;flex-shrink:0}

/* variant chips */
.var-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding:1px}
.var-tabs::-webkit-scrollbar{display:none}
.var-tab{flex:0 0 auto;background:var(--surface-alt);border:1px solid var(--line-strong);color:var(--muted);padding:6px 14px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap}
.var-tab.active{background:var(--grad-red);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(200,30,30,.28)}
.var-pane{display:none}
.var-pane.active{display:block}

/* day nav */
.day-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:16px;padding:1px}
.day-nav::-webkit-scrollbar{display:none}
.day-btn,.pday-btn{flex:0 0 auto;background:var(--surface-alt);border:1px solid var(--line-strong);color:var(--soft);padding:9px 16px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:var(--radius-pill);cursor:pointer}
.day-btn.active,.pday-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.day-pane,.pday-pane{display:none}
.day-pane.active,.pday-pane.active{display:block}

.day-header{margin-bottom:16px}
.day-type{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
.day-name{font-family:'Switzer',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.01em;margin-bottom:4px}
.day-focus{font-size:13px;color:var(--muted)}

/* exercise */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:8px;box-shadow:var(--shadow-card)}
.ex.star{border-color:rgba(200,30,30,.28)}
.ex-name{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.ex-name .badge{display:inline-block;font-size:9px;font-weight:800;background:var(--grad-red);color:#fff;padding:3px 9px;border-radius:var(--radius-pill);margin-left:6px;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.ex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.ex-cell{background:var(--surface-alt);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.ex-cell-label{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:3px}
.ex-cell-val{font-family:'Switzer',sans-serif;font-size:13px;font-weight:800;color:var(--ink)}
.ex-note{font-size:12px;color:var(--muted);line-height:1.5;padding-top:10px;border-top:1px solid var(--line)}
.ex-video-btn{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 14px;background:var(--red-dim);border:1px solid rgba(200,30,30,.2);color:var(--red);font-size:11px;font-weight:800;border-radius:var(--radius-pill);text-decoration:none}

/* rest day */
.rest-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:36px 20px;text-align:center;margin-top:8px}
.rest-card .big{font-family:'Switzer',sans-serif;font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--red);margin-bottom:8px}
.rest-card p{font-size:13px;color:var(--muted);line-height:1.7}

/* shop */
.shop-section{margin-bottom:20px}
.shop-title{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.shop-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.shop-item:last-child{border:none}
.shop-item-name{color:var(--ink);flex:1}
.shop-item-qty{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}

/* table */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;padding:8px 0;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--red);border-bottom:1px solid var(--line)}
table.t td{padding:10px 0;color:var(--muted);border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border:none}
table.t td:first-child{color:var(--ink);font-weight:600;padding-right:16px;width:48%}

/* pagos */
.pago-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.pago-item:last-child{border:none}
.pago-item-name{font-size:14px;font-weight:700}
.pago-item-date{font-size:12px;color:var(--muted);margin-top:2px}
.pago-item-right{text-align:right}
.pago-item-amount{font-family:'Switzer',sans-serif;font-size:15px;font-weight:800}
.pago-badge{display:inline-block;margin-top:4px;font-size:10px;font-weight:800;padding:3px 10px;border-radius:var(--radius-pill);letter-spacing:.04em;text-transform:uppercase}
.pago-badge.paid{background:var(--good-dim);color:var(--good)}
.pago-badge.pending{background:var(--red-dim);color:var(--red)}
.pago-badge.due-soon{background:var(--warn-dim);color:var(--warn)}
.alert-amber{background:var(--warn-dim);border:1px solid rgba(185,116,10,.25);padding:13px 15px;border-radius:16px;margin-bottom:16px;font-size:13px;line-height:1.6;color:#7a5106;display:flex;gap:10px}
.alert-amber b{color:var(--warn)}

/* progreso */
.log-ex{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:8px;box-shadow:var(--shadow-card)}
.log-ex-name{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.log-inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.log-input label{display:block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.log-input input{width:100%;background:var(--surface-alt);border:1px solid var(--line-strong);color:var(--ink);border-radius:10px;padding:9px 8px;font-size:14px;font-weight:700;font-family:inherit;-moz-appearance:textfield}
.log-input input::placeholder{color:var(--soft);font-weight:500}
.log-input input:focus{outline:none;border-color:var(--red)}
.log-history{padding-top:8px;border-top:1px solid var(--line)}
.log-history-empty{font-size:11px;color:var(--soft);font-style:italic}
.log-history-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);padding:4px 0}
.log-history-row b{color:var(--ink);font-weight:700}
.log-history-row .log-date{color:var(--soft);white-space:nowrap}
.log-ex-save{width:100%;padding:11px;border-radius:var(--radius-pill);border:none;background:var(--grad-red);color:#fff;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(200,30,30,.28)}
.log-ex-save:active{opacity:.85}
.log-ex-save:disabled{opacity:.6;box-shadow:none}
.log-ex-msg{text-align:center;font-size:11px;color:var(--muted);margin:6px 0 2px;min-height:14px}
.log-ex-msg.ok{color:var(--good)}

/* camera scanner — minimal entry card */
.cam-card{display:flex;align-items:center;gap:12px;padding:14px 16px}
.cam-card-icon{width:42px;height:42px;border-radius:13px;background:var(--red-dim);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.cam-card-text{flex:1;min-width:0}
.cam-card-title{font-size:14px;font-weight:800;color:var(--ink)}
.cam-card-sub{font-size:12px;color:var(--muted);margin-top:1px}

.cam-modal{position:fixed;inset:0;z-index:200;background:#000;display:none;flex-direction:column}

.cam-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.cam-overlay svg{width:84vw;height:84vw;max-width:380px;max-height:380px}
.cam-footer{background:rgba(11,7,7,.95);border-top:1px solid rgba(255,255,255,.08);padding:12px 20px 16px;flex-shrink:0}

.cam-bottom{display:flex;align-items:center;justify-content:space-between}
.cam-hint{font-size:12px;color:#9a908c}
.cam-close{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;width:42px;height:42px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* splash / opening */
#splash{
  position:fixed;inset:0;z-index:9999;

  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;
}
#splash.hiding{animation:splashOut .55s cubic-bezier(.4,0,1,1) forwards}
.s-logo{width:150px;max-width:48vw;filter:brightness(0) invert(1);animation:logoIn .8s cubic-bezier(.22,1,.36,1) .15s both}
.s-avatar-wrap{
  width:96px;height:96px;border-radius:50%;padding:3px;

}
.s-avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:2px solid var(--ink)}

.s-name{font-family:'Switzer',sans-serif;font-weight:800;font-size:18px;letter-spacing:-.01em;color:#fff;margin-top:-10px;animation:logoIn .5s ease .7s both}

/* macros */
.macro-row{margin-bottom:14px}

/* ---- plantilla: agregados sobre el estilo de los planes ---- */
.tip strong,.rule strong{color:var(--ink)}

/* semana temporal */
@keyframes wkPulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes wkIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.wk-chip{display:flex;align-items:center;gap:10px;width:100%;margin:2px 0 16px;padding:11px 16px;background:#fff;border:1px solid rgba(200,30,30,.30);border-radius:22px;box-shadow:0 8px 20px rgba(200,30,30,.10);font-family:inherit;text-align:left;cursor:pointer;color:var(--ink);transition:background .25s,color .25s,box-shadow .25s}
.wk-chip-dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--red);position:relative}
.wk-chip:not(.on) .wk-chip-dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--red-bright);animation:wkPulse 2.2s ease-out infinite}
.wk-chip-txt{flex:1;min-width:0;font-size:12.5px;font-weight:800;letter-spacing:-.005em}

.wk-row-name small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);margin-top:1px}

/* asistencia: calendario mensual */
.att-card{padding:16px 16px 14px;margin-bottom:18px}
.att-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.att-title{flex:1;font-size:15px;font-weight:800;text-transform:capitalize}
.att-nav{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface-alt);color:var(--ink);font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}

.att-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.att-stat{background:var(--surface-alt);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.att-stat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.att-stat span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.att-stat.hi{background:var(--grad-red);border-color:transparent;color:#fff}
.att-stat.hi span{color:rgba(255,255,255,.8)}
.att-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.att-dow{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--soft);padding-bottom:4px}
.att-day{position:relative;height:38px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink)}
.att-day.out{visibility:hidden}
.att-day.future{color:var(--soft);font-weight:600}
.att-day.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.att-day.done{background:var(--red-dim)}
.att-day .dot{width:6px;height:6px;border-radius:50%;background:var(--red);margin-top:3px;box-shadow:0 0 0 2px rgba(200,30,30,.15)}

.att-views button{flex:1;border:none;background:none;border-radius:999px;padding:7px 0;font-family:inherit;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer}
.att-views button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(23,18,15,.08)}

/* mapa de calor anual (semanas en columnas, días en filas) */
.heat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.heat-count{font-size:16px;font-weight:800;letter-spacing:-.01em}
.heat-year{appearance:none;-webkit-appearance:none;border:1px solid var(--line-strong);background:var(--surface-alt);border-radius:999px;padding:6px 26px 6px 12px;font-family:inherit;font-size:13px;font-weight:800;color:var(--ink);background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.heat-wrap{display:flex;gap:6px}

.heat-rows span{line-height:13px}
.heat-scroll{overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.heat-scroll::-webkit-scrollbar{display:none}
.heat-grid{display:grid;grid-auto-flow:column;grid-template-rows:14px repeat(7,13px);grid-auto-columns:13px;gap:3px;width:max-content;padding-right:2px}
.heat-month{font-size:9.5px;font-weight:700;color:var(--soft);white-space:nowrap;line-height:14px}
.heat-cell{border-radius:3.5px;background:rgba(23,18,15,.06)}

.heat-cell.l2{background:#ec8f84}
.heat-cell.l3{background:#dc4a3c}

.heat-legend{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:11px;color:var(--soft);font-weight:700}
.heat-legend .scale{display:flex;align-items:center;gap:3px}
.heat-legend .scale i{width:11px;height:11px;border-radius:3px;display:block}

/* botón glass "Empezar entrenamiento" (solo en Rutina) */

.train-pill:active{transform:scale(.97)}
.train-pill .tp-icon{width:34px;height:34px;border-radius:50%;background:var(--grad-red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 6px 16px rgba(200,30,30,.35);flex-shrink:0}
.train-pill .tp-text{display:flex;flex-direction:column;line-height:1.15;text-align:left}

// ---------- helpers ----------
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Texto con formato mínimo: se escapa todo y se re-habilitan solo tags inline sin atributos.
function rich(s){
  return esc(s)
    .replace(/&lt;(\/?)(b|strong|em|i|small|span)&gt;/g, '<$1$2>')
    .replace(/&lt;br\s*\/?&gt;/g, '<br>')
    .replace(/\n/g, '<br>')
    .replace(/\[fruta:(\w+)\]/g, '<button class="fruit-btn" data-tier="$1" aria-label="¿Qué fruta comer?">🍎</button>');
}
function safeUrl(u){
  const s = String(u ?? '').trim();
  return /^(https?:\/\/|\/)/i.test(s) ? esc(s) : '#';
}
function normDay(s){
  return String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().slice(0,3);
}
const TODAY_KEYS = ['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];
const TODAY_NAMES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const exIsCardio = ex => /^(cardio|aer[oó]bico)/i.test(ex.nombre || '');

// ---------- blocks ----------
function renderBlocks(blocks){
  return (blocks || []).map(renderBlock).join('');
}

function renderBlock(b){
  if(!b || !b.type) return '';
  switch(b.type){
    case 'label':
      return `<p class="block-label">${rich(b.text)}</p>`;
    case 'tip':

    case 'macros':

      }).join('')}</div>`;
    case 'table':
      return `<div class="card"><table class="t">${b.headers && b.headers.length ? `<tr>${b.headers.map(h => `<th>${rich(h)}</th>`).join('')}</tr>` : ''}${(b.rows||[]).map(r =>
        `<tr>${r.map(c => `<td>${rich(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;
    case 'schedule':

      return `<div class="card">${(b.items||[]).map(t =>

    case 'banner':
      return `<a class="promo-banner" href="${safeUrl(b.href)}" target="_blank" rel="noopener noreferrer"><img src="${safeUrl(b.img)}" alt="${esc(b.alt)}"></a>`;

      return `<div class="card cam-card"><div class="cam-card-icon">📷</div><div class="cam-card-text"><div class="cam-card-title">${rich(b.title || 'Armá tu plato · almuerzo y cena')}</div><div class="cam-card-sub">${rich(b.sub || '')}</div></div><button class="cam-card-btn" data-open-cam>${esc(b.btn || 'Abrir')}</button></div>`;
    case 'meals':
      return renderMeals(b);
    case 'days':
      return renderDays(b);
    case 'ex':
      return renderEx(b);
    case 'group':
      return `<div class="ss-group">${b.label ? `<div class="ss-label">${rich(b.label)}</div>` : ''}${renderBlocks(b.blocks)}</div>`;
    case 'rest':
      return `<div class="rest-card">${b.big ? `<div class="big">${rich(b.big)}</div>` : ''}<p>${rich(b.text)}</p></div>`;
    case 'shop':
      return (b.sections||[]).map(s =>
        `<div class="shop-section"><div class="shop-title">${rich(s.title)}</div>${(s.items||[]).map(i =>
          `<div class="shop-item"><span class="shop-item-name">${rich(i.name)}</span><span class="shop-item-qty">${rich(i.qty)}</span></div>`).join('')}</div>`
      ).join('');
    case 'pagos':
      return `<div class="card flush">${(b.items||[]).map((p, i) =>
        `<div class="pago-item" data-pago="${i}"><div class="pago-item-left"><div class="pago-item-name">${rich(p.name)}</div>${p.detail ? `<div class="pago-item-date">${rich(p.detail)}</div>` : ''}</div><div class="pago-item-right">${p.amount ? `<div class="pago-item-amount">${rich(p.amount)}</div>` : ''}${p.badge ? `<div class="pago-badge ${['paid','pending','due-soon'].includes(p.status) ? p.status : 'pending'}">${rich(p.badge)}</div>` : ''}</div></div>`
      ).join('')}</div>`;
    case 'html':
      // Contenido especial importado tal cual del HTML viejo (solo lo escribe el admin).
      return b.html || '';
    default:
      return '';
  }
}

    const vars = m.variants && m.variants.length ? m.variants : [{ items: [] }];

    const first = vars[0];

    return `<div class="meal${m.open ? ' open' : ''}" style="padding:0 16px" data-meal-key="${esc(m.key || ('meal' + mi))}">
      <div class="meal-head">
        <div class="meal-name"><span class="meal-num">${esc(m.num || String(mi + 1).padStart(2, '0'))}</span>${rich(m.name)}</div>
        <div style="display:flex;align-items:center;gap:8px">${m.time ? `<span class="meal-time">${rich(m.time)}</span>` : ''}${kcal}<span class="meal-chevron">▾</span></div>
      </div>

        ${vars.length > 1 ? `<div class="var-tabs">${vars.map((v, vi) => `<button class="var-tab${vi === 0 ? ' active' : ''}" data-vt="${id}-${vi}">${rich(v.name || ('Opción ' + (vi + 1)))}</button>`).join('')}</div>` : ''}
        ${vars.map((v, vi) => `<div class="var-pane${vi === 0 ? ' active' : ''}" id="vp-${id}-${vi}" data-kcal="${esc(v.kcal ?? '')}">

            `<li><span>${rich(it.name)}${it.fruit ? ` <button class="fruit-btn" data-tier="${esc(it.fruit)}" aria-label="¿Qué fruta comer?">🍎</button>` : ''}</span><span class="qty">${rich(it.qty)}</span></li>`).join('')}</ul>

function renderMealMacros(v){

function renderDays(b){

function dayInner(d){
  return `${d.kind || d.name || d.focus ? `<div class="day-header">${d.kind ? `<div class="day-type">${rich(d.kind)}</div>` : ''}${d.name ? `<div class="day-name">${rich(d.name)}</div>` : ''}${d.focus ? `<div class="day-focus">${rich(d.focus)}</div>` : ''}</div>` : ''}
      ${renderBlocks(d.blocks)}`;
}

// ---------- semana temporal ----------
const DOW3 = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DOW_NAMES = TODAY_NAMES;
function isoToday(){
  const t = new Date();
  return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
}
function tempWeekVisible(){
  const tw = PLAN.tempWeek;
  return !!(tw && tw.days && tw.days.length && tw.end && isoToday() <= tw.end);
}
// Cada día de la semana temporal: "off" o una copia del día base de la rutina con sus cambios (etiqueta, nota, RIR).
function tempWeekEntries(){
  const tw = PLAN.tempWeek;
  const base = trainingDays();
  return (tw.days || []).map(d => {
    const dt = new Date(d.date + 'T00:00:00');
    const dow = dt.getDay();
    const dateStr = dt.getDate() + '/' + (dt.getMonth() + 1);
    const e = { date: d.date, dow, dateStr, label: DOW3[dow].toUpperCase() + ' ' + dt.getDate(), dayName: DOW_NAMES[dow], raw: d };
    if(!d.base || d.base === 'off'){ e.off = true; return e; }
    const src = base.find(x => normDay(x.day) === normDay(d.base));
    if(!src){ e.off = true; return e; }
    const day = JSON.parse(JSON.stringify(src));
    day.kind = DOW_NAMES[dow] + ' ' + dateStr + (d.tag ? ' · ' + d.tag : '');
    if(d.focus) day.focus = d.focus;
    if(d.rir){
      dayExercises(day).filter(ex => !exIsCardio(ex)).forEach(ex => {
        (ex.cells || []).forEach(c => { if(/^rir/i.test(String(c.label || '').replace(/<[^>]*>/g, ''))) c.value = d.rir; });
      });
    }
    e.day = day;
    return e;
  });
}

function renderTempWeek(){
  const tw = PLAN.tempWeek;
  const today = isoToday();
  const on = today >= tw.start && today <= tw.end;
  const entries = tempWeekEntries();
  const strip = s => String(s ?? '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]*>/g, '');
  const rows = entries.map(e => {
    const name = e.off ? 'Off' : strip(e.day.name);
    const sub = e.off ? (e.raw.off || 'Día libre')
      : [strip(e.raw.focus || e.day.focus).split('.')[0].replace(/-dominante$/i, ''), e.raw.tag].filter(Boolean).join(' · ');
    return `<div class="wk-row${e.off ? ' free' : ''}${e.date === today ? ' today' : ''}"><span class="wk-row-day">${esc(DOW3[e.dow] + ' ' + e.dateStr)}</span><span class="wk-row-name">${esc(name)}${sub ? `<small>${esc(sub)}</small>` : ''}</span></div>`;
  }).join('');
  const train = entries.filter(e => !e.off);
  let start = train.findIndex(e => e.date >= today);
  if(start < 0) start = 0;
  const id = 'w' + (++uid);
  return `<button class="wk-chip${on ? ' on' : ''}" type="button" data-wk-toggle data-default="${on ? 1 : 0}" aria-expanded="${on}">
      <span class="wk-chip-dot"></span>
      <span class="wk-chip-txt">${rich(tw.title || 'Rutina de esta semana')}${tw.sub ? `<small>${rich(tw.sub)}</small>` : ''}</span>
      <span class="wk-chip-arrow">▼</span>
    </button>
    <div id="wk-box"${on ? '' : ' hidden'}>
      <div class="wk-intro">${tw.intro ? `<div class="wk-intro-lead">${rich(tw.intro)}</div>` : ''}${rows}</div>
      ${train.length ? `<div class="day-nav" data-days="${id}">${train.map((e, i) =>
        `<button class="day-btn${i === start ? ' active' : ''}" data-day="${id}-${i}">${esc(e.label)}</button>`).join('')}</div>
      ${train.map((e, i) => `<div class="day-pane${i === start ? ' active' : ''}" id="pane-${id}-${i}">${dayInner(e.day)}</div>`).join('')}` : ''}
    </div>`;
}

function renderRutina(){
  const S = PLAN.sections || {};
  const head = sectionHead(S.rutina);
  const body = renderBlocks(S.rutina?.blocks);
  if(!tempWeekVisible()) return head + body;
  const tw = PLAN.tempWeek;
  const today = isoToday();
  const on = today >= tw.start && today <= tw.end;
  return head + renderTempWeek() + `<div id="rutina-normal"${on ? ' hidden' : ''}>${body}</div>`;
}

function renderEx(ex){
  const href = ex.video ? safeUrl(ex.video) : 'https://www.youtube.com/results?search_query=' + encodeURIComponent((ex.nombre || '') + ' técnica ejercicio short');
  const video = `<a class="ex-video-btn" href="${href}" target="_blank" rel="noopener">▶ Ver video</a>`;
  return `<div class="ex${ex.star ? ' star' : ''}">
    <div class="ex-name">${esc(ex.nombre)}${(ex.badges || []).map(b => ` <span class="badge${b.dark ? ' dark' : ''}">${esc(b.text)}</span>`).join('')}</div>
    ${ex.cells && ex.cells.length ? `<div class="ex-grid">${ex.cells.map(c =>
      `<div class="ex-cell"><div class="ex-cell-label">${rich(c.label)}</div><div class="ex-cell-val">${rich(c.value)}</div></div>`).join('')}</div>` : ''}
    ${ex.note ? `<div class="ex-note">${rich(ex.note)}${video}</div>` : video}

}

// ---------- secciones ----------
function sectionHead(s){
  if(!s) return '';
  return `${s.title ? `<p class="section-title">${rich(s.title)}${s.subtitle ? ` <span>${rich(s.subtitle)}</span>` : ''}</p>` : ''}${s.lead ? `<p class="section-lead">${rich(s.lead)}</p>` : ''}`;
}

// Días de entrenamiento con ejercicios que se registran (para Progreso y "Hoy toca").
function trainingDays(){
  const out = [];
  const visit = blocks => (blocks || []).forEach(b => {
    if(b.type === 'days') b.items.forEach(d => out.push(d));
  });
  visit(PLAN.sections?.rutina?.blocks);
  return out;
}
function dayExercises(d){
  const out = [];
  const visit = blocks => (blocks || []).forEach(b => {
    if(b.type === 'ex') out.push(b);
    else if(b.type === 'group') visit(b.blocks);
    else if(b.type === 'days') b.items.forEach(x => visit(x.blocks));
  });
  visit(d.blocks);
  return out;
}

function renderProgreso(){
  const s = PLAN.sections?.progreso || {};
  const days = trainingDays()
    .map(d => ({ day: d.day, exs: dayExercises(d).filter(e => e.log !== 'none') }))
    .filter(d => d.exs.length);
  const head = `<div class="card att-card" id="att-card">${renderAttendance()}</div>` +
    sectionHead({ title: s.title || 'Progreso', subtitle: s.subtitle ?? '/ pesos', lead: s.lead ?? 'Cargá el peso de cada serie después de entrenar. Se guarda para siempre y podés ver la evolución semana a semana.' });
  if(!days.length) return head + '<div class="card"><p class="section-lead" style="margin:0">Todavía no hay ejercicios para registrar.</p></div>';
  return head + `<div class="day-nav">${days.map((d, i) =>
      `<button class="pday-btn${i === 0 ? ' active' : ''}" data-pday="${i}">${esc(d.day)}</button>`).join('')}</div>
    ${days.map((d, i) => `<div class="pday-pane${i === 0 ? ' active' : ''}" id="pane-p-${i}" data-day-label="${esc(d.day)}">
      ${d.exs.map(ex => {
        const unit = ex.log || 'kg';
        const step = unit === 'kg' ? '0.5' : '1';
        const mode = unit === 'kg' ? 'decimal' : 'numeric';
        return `<div class="log-ex" data-exercise="${esc(ex.logName || ex.nombre)}">
          <div class="log-ex-name">${esc(ex.nombre)}</div>
          <div class="log-inputs">${[1,2,3].map(n => `<div class="log-input"><label>Serie ${n}</label><input type="number" step="${step}" inputmode="${mode}" placeholder="${esc(unit)}"></div>`).join('')}</div>
          <button class="log-ex-save">Guardar</button>
          <div class="log-ex-msg"></div>
          <div class="log-history"><span class="log-history-empty">Cargando historial…</span></div>
        </div>`;
      }).join('')}
    </div>`).join('')}`;
}

function renderFeatureCard(){
  const d = new Date().getDay();
  let today = trainingDays().find(x => normDay(x.day) === TODAY_KEYS[d]);
  let title, text, meta;
  // Si hoy cae dentro de la semana temporal, manda esa semana.
  const tw = PLAN.tempWeek;
  const tempToday = tempWeekVisible() && isoToday() >= tw.start ? tempWeekEntries().find(e => e.date === isoToday()) : null;
  if(tempToday){
    if(tempToday.off){
      return `<div class="feature-card"><div class="feature-tag">⚡ Hoy toca</div><div class="feature-content"><h3>${esc(TODAY_NAMES[d] + ' — Off')}</h3><p>${esc(tempToday.raw.off || 'Día libre. Recuperación, buena comida y buen sueño.')}</p><div class="feature-meta"><span>★ ${esc(tw.title || 'Semana especial')}</span></div></div></div>`;
    }
    today = tempToday.day;
  }
  if(!today){
    title = TODAY_NAMES[d] + ' — Descanso';
    text = 'Día libre. Recuperación, buena comida y buen sueño.';
    meta = '<span>★ Descanso</span>';
  } else {
    const exs = dayExercises(today);
    const lifts = exs.filter(e => !exIsCardio(e));
    const hasCardio = lifts.length !== exs.length;
    const strip = s => String(s ?? '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]*>/g, '').replace(/\[fruta:\w+\]/g, '');
    if(!lifts.length){
      const rest = (today.blocks || []).find(b => b.type === 'rest');
      title = TODAY_NAMES[d] + ' — ' + strip(today.kind) + (today.name ? ' · ' + strip(today.name) : '');
      text = strip(rest?.text) || strip(today.focus);
      meta = `<span>★ ${esc(strip(today.kind))}</span><span>${esc(strip(today.focus))}</span>`;
    } else {
      title = TODAY_NAMES[d] + ' — ' + strip(today.name);
      text = strip(today.kind) + '. ' + lifts.slice(0, 4).map(e => e.nombre).join(', ') + (lifts.length > 4 ? ' y más.' : '.');
      const star = lifts.find(e => e.star);
      meta = `<span>${esc(star ? '★ Prioridad: ' + star.nombre : '★ ' + strip(today.kind))}</span><span>${lifts.length} ejercicios${hasCardio ? ' + cardio' : ''}</span>`;
    }
  }
  return `<div class="feature-card"><div class="feature-tag">⚡ Hoy toca</div><div class="feature-content"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="feature-meta">${meta}</div></div></div>`;
}

  applyPaymentReminder();
  restoreVariants();
  if(!rendered) document.body.dataset.tab = 'dn-resumen';
  updateTrainFab();
  scrollHeatToEnd();
  rendered = true;
}

// ---------- pagos ----------
// Si el admin cargó cuotas en el panel, reemplazan a las escritas en el plan (el resto del texto se mantiene).
function pagoBlocks(){
  const blocks = (PLAN.sections?.pago?.blocks || []).slice();
  if(!PAYMENTS || !PAYMENTS.length) return blocks;
  const money = n => new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Number(n) || 0);
  const date = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('es-AR') : '';
  // Primero lo que falta pagar (lo más próximo arriba), después lo pagado (lo más reciente arriba).
  const sorted = [
    ...PAYMENTS.filter(p => p.status !== 'paid').sort((a, b) => String(a.due_date || '9999').localeCompare(String(b.due_date || '9999'))),
    ...PAYMENTS.filter(p => p.status === 'paid').sort((a, b) => String(b.paid_at || '').localeCompare(String(a.paid_at || ''))),
  ];
  const items = sorted.map(p => ({
    name: p.concept,
    detail: p.status === 'paid' ? ('Pagada' + (p.paid_at ? ' el ' + date(p.paid_at) : '')) : (p.due_date ? 'Vence el ' + date(p.due_date) : ''),
    amount: money(p.amount),
    status: p.status === 'paid' ? 'paid' : 'pending',
    badge: p.status === 'paid' ? 'Pagada' : 'Pendiente',
    due: p.status === 'paid' ? undefined : (p.due_date || undefined),
  }));
  const fresh = { type: 'pagos', items };
  const i = blocks.findIndex(b => b.type === 'pagos');
  if(i >= 0){ blocks[i] = fresh; return blocks.filter((b, j) => b.type !== 'pagos' || j === i); }
  return [{ type: 'label', text: 'Cuotas' }, fresh, ...blocks];
}

// ---------- recordatorio de pago (cuotas con fecha de vencimiento) ----------
function applyPaymentReminder(){
  const REMINDER_WINDOW = 5;
  const items = [];
  pagoBlocks().forEach(b => {
    if(b.type === 'pagos') (b.items || []).forEach((p, i) => { if(p.due && p.status !== 'paid') items.push({ p, i }); });
  });
  if(!items.length) return;
  items.sort((a, b) => new Date(a.p.due) - new Date(b.p.due));
  const next = items[0].p;
  const today = new Date(); today.setHours(0,0,0,0);
  const dueDate = new Date(next.due + 'T00:00:00');
  const days = Math.round((dueDate - today) / 86400000);
  if(isNaN(days) || days > REMINDER_WINDOW) return;
  const amount = next.amount ? ' (' + next.amount + ')' : '';
  const dateStr = dueDate.toLocaleDateString('es-AR');
  let msg;
  if(days > 1) msg = `Tu próxima cuota${amount} vence en ${days} días — ${dateStr}.`;
  else if(days === 1) msg = `Tu próxima cuota${amount} vence mañana — ${dateStr}.`;
  else if(days === 0) msg = `Tu próxima cuota${amount} vence hoy.`;
  else { const n = Math.abs(days); msg = `Tu cuota${amount} venció hace ${n} día${n === 1 ? '' : 's'} — ${dateStr}.`; }
  const alertEl = document.getElementById('pago-alert');
  if(alertEl) alertEl.innerHTML = `<div class="alert-amber"><span>⚠</span><div><b>Recordatorio de pago.</b> ${esc(msg)}</div></div>`;
  document.getElementById('pago-dot')?.classList.add('show');
  const badge = document.querySelector(`.pago-item[data-pago="${items[0].i}"] .pago-badge`);
  if(badge){ badge.textContent = days < 0 ? 'Vencida' : 'Vence pronto'; badge.classList.add('due-soon'); badge.classList.remove('pending'); }
}

function activateVariant(chip, remember){

  body.querySelectorAll(':scope > .var-pane').forEach(p => p.classList.remove('active'));

  if(remember){
    try{ localStorage.setItem('vt-' + chip.closest('.meal').dataset.mealKey, chip.dataset.vt.split('-').pop()); }catch(e){}
  }
}
function restoreVariants(){
  try{
    document.querySelectorAll('.meal[data-meal-key]').forEach(meal => {

      if(saved === null) return;
      const chip = [...meal.querySelectorAll('.var-tab')].find(c => c.dataset.vt.split('-').pop() === saved);

    });

}

function athlete(){ return PLAN.athlete || STUDENT.slug; }
function fmtDate(d){

}
async function loadHistory(logExEl){
  const histEl = logExEl.querySelector('.log-history');
  if(PREVIEW){ histEl.innerHTML = '<span class="log-history-empty">Vista previa: el historial se ve en la app del alumno</span>'; return; }

async function saveLog(btn){
  const logEx = btn.closest('.log-ex');
  const dayLabel = logEx.closest('.pday-pane').dataset.dayLabel;
  const msgEl = logEx.querySelector('.log-ex-msg');
  const inputs = logEx.querySelectorAll('.log-inputs input');
  const vals = [...inputs].map(i => i.value === '' ? null : parseFloat(i.value));
  if(vals.every(v => v === null)){ msgEl.textContent = 'Cargá al menos un peso.'; msgEl.classList.remove('ok'); return; }
  if(PREVIEW){ msgEl.textContent = 'Vista previa: no se guarda.'; msgEl.classList.remove('ok'); return; }
  btn.disabled = true;
  const prevText = btn.textContent;
  btn.textContent = 'Guardando…';
  const { error } = await sb.from('exercise_logs').insert([{
    athlete: athlete(), day: dayLabel, exercise: logEx.dataset.exercise,
    set1_weight: vals[0], set2_weight: vals[1], set3_weight: vals[2]
  }]);
  btn.disabled = false;
  btn.textContent = prevText;
  if(error){ msgEl.textContent = 'Error al guardar, probá de nuevo.'; msgEl.classList.remove('ok'); return; }
  msgEl.textContent = '✓ Guardado';
  msgEl.classList.add('ok');
  inputs.forEach(i => i.value = '');
  loadHistory(logEx);
  setTimeout(() => { msgEl.textContent = ''; msgEl.classList.remove('ok'); }, 3000);
}

// ---------- asistencia: "Empezar entrenamiento" + calendario mensual ----------
let USER_ID = null;
let SESSIONS = [];          // [{ date:'AAAA-MM-DD', started_at, finished_at }]
let attMonthOffset = 0;     // 0 = mes actual, -1 = anterior…
let attView = 'year';       // 'year' (mapa de calor) | 'month' (calendario)
let heatYear = new Date().getFullYear();
let DAY_SETS = {};          // 'AAAA-MM-DD' -> series cargadas ese día
let trainTimer = null;
const MONTH_NAMES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

async function loadSessions(){
  if(PREVIEW || !USER_ID) return;
  const [ses, logs] = await Promise.all([
    sb.from('workout_sessions').select('id,date,started_at,finished_at').eq('user_id', USER_ID)
      .order('date', { ascending: false }).limit(800),
    // Series cargadas en Progreso: dan la intensidad del mapa de calor (y los días entrenados de antes del botón).
    sb.from('exercise_logs').select('date,set1_weight,set2_weight,set3_weight').eq('athlete', athlete())
      .order('date', { ascending: false }).limit(5000),
  ]);
  if(!ses.error) SESSIONS = ses.data || [];
  if(!logs.error){
    DAY_SETS = {};
    (logs.data || []).forEach(l => {
      const n = [l.set1_weight, l.set2_weight, l.set3_weight].filter(v => v !== null && v !== undefined).length;
      DAY_SETS[l.date] = (DAY_SETS[l.date] || 0) + n;
    });
  }
  refreshAttendance();
  updateTrainFab();
}
const todaySession = () => SESSIONS.find(s => s.date === isoToday());

function refreshAttendance(){
  const el = document.getElementById('att-card');
  if(el){ el.innerHTML = renderAttendance(); scrollHeatToEnd(); }
}
// El mapa arranca mostrando las semanas más recientes (como el de la imagen).
function scrollHeatToEnd(){
  const sc = document.querySelector('.heat-scroll');
  if(sc) sc.scrollLeft = sc.scrollWidth;
}

// Días entrenados = tocó "Empezar entrenamiento" o cargó pesos ese día.
function trainedDays(){
  const set = new Set(SESSIONS.map(s => s.date));
  Object.keys(DAY_SETS).forEach(d => set.add(d));
  return set;
}
function heatLevel(iso, trained){
  if(!trained.has(iso)) return 0;
  const n = DAY_SETS[iso] || 0;
  if(n >= 18) return 4;
  if(n >= 12) return 3;
  if(n >= 6) return 2;
  return 1;
}

function renderAttendance(){
  return `<div class="att-views">
      <button data-att-view="year" class="${attView === 'year' ? 'on' : ''}">Año</button>
      <button data-att-view="month" class="${attView === 'month' ? 'on' : ''}">Mes</button>
    </div>${attView === 'year' ? renderHeatmap() : renderMonth()}`;
}

function renderHeatmap(){
  const trained = trainedDays();
  const today = isoToday();
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const years = [...new Set([new Date().getFullYear(), ...[...trained].map(d => Number(d.slice(0, 4)))])].sort((a, b) => b - a);
  const y = heatYear;
  // Semanas de lunes a domingo, desde la que contiene el 1/1 hasta hoy (o el 31/12 si es un año pasado).
  const start = new Date(y, 0, 1); start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
  const lastDay = y === new Date().getFullYear() ? new Date() : new Date(y, 11, 31);
  const end = new Date(lastDay); end.setDate(end.getDate() + (6 - (end.getDay() + 6) % 7));
  const cells = [];
  let prevMonth = -1;
  let count = 0;
  for(const w = new Date(start); w <= end; w.setDate(w.getDate() + 7)){
    // Etiqueta del mes arriba de la semana donde empieza (solo si cae dentro del año).
    const firstIn = [...Array(7)].map((_, i) => { const x = new Date(w); x.setDate(x.getDate() + i); return x; }).find(x => x.getFullYear() === y);
    const m = firstIn ? firstIn.getMonth() : -1;
    cells.push(`<span class="heat-month">${m !== prevMonth && m >= 0 && firstIn.getDate() <= 7 ? MONTH_NAMES[m].slice(0, 3) : ''}</span>`);
    if(m >= 0) prevMonth = m;
    for(let i = 0; i < 7; i++){
      const d = new Date(w); d.setDate(d.getDate() + i);
      const key = iso(d);
      if(d.getFullYear() !== y || key > today){ cells.push('<i class="heat-cell out"></i>'); continue; }
      const lv = heatLevel(key, trained);
      if(lv) count++;
      const title = lv ? `${d.getDate()}/${d.getMonth() + 1} · ${DAY_SETS[key] ? DAY_SETS[key] + ' series' : 'entrenó'}` : `${d.getDate()}/${d.getMonth() + 1}`;
      cells.push(`<i class="heat-cell${lv ? ' l' + lv : ''}${key === today ? ' today' : ''}" title="${title}"></i>`);
    }
  }
  return `<div class="heat-head">
      <div class="heat-count">${count} entrenamiento${count === 1 ? '' : 's'}</div>
      <select class="heat-year" data-heat-year aria-label="Año">${years.map(v => `<option value="${v}"${v === y ? ' selected' : ''}>${v}</option>`).join('')}</select>
    </div>
    <div class="heat-wrap">
      <div class="heat-rows"><span></span><span>Lun</span><span></span><span>Mié</span><span></span><span>Vie</span><span></span><span>Dom</span></div>
      <div class="heat-scroll"><div class="heat-grid">${cells.join('')}</div></div>
    </div>
    <div class="heat-legend"><span>Series</span><span class="scale">Menos <i style="background:rgba(23,18,15,.06)"></i><i style="background:#f6c9c3"></i><i style="background:#ec8f84"></i><i style="background:#dc4a3c"></i><i style="background:#b81818"></i> Más</span></div>
    ${PREVIEW ? '<div class="att-foot">Vista previa: el alumno ve acá su año de entrenamientos.</div>' : ''}`;
}

// Semanas seguidas (lunes a domingo) con al menos un entrenamiento, contando hacia atrás desde esta.
function weekStreak(){
  const days = trainedDays();
  const monday = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const has = start => { for(let i = 0; i < 7; i++){ const x = new Date(start); x.setDate(x.getDate() + i); if(days.has(iso(x))) return true; } return false; };
  let w = monday(new Date()), streak = 0;
  if(!has(w)) w.setDate(w.getDate() - 7);   // la semana actual todavía puede completarse
  while(has(w)){ streak++; w.setDate(w.getDate() - 7); }
  return streak;
}

function renderMonth(){
  const now = new Date();
  const first = new Date(now.getFullYear(), now.getMonth() + attMonthOffset, 1);
  const y = first.getFullYear(), m = first.getMonth();
  const prefix = y + '-' + String(m + 1).padStart(2, '0');
  const done = new Set([...trainedDays()].filter(d => d.startsWith(prefix)));
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;   // semana empieza el lunes
  const today = isoToday();
  const cells = [];
  for(let i = 0; i < lead; i++) cells.push('<div class="att-day out"></div>');
  for(let d = 1; d <= daysInMonth; d++){
    const iso = prefix + '-' + String(d).padStart(2, '0');
    const cls = ['att-day', done.has(iso) ? 'done' : '', iso === today ? 'today' : '', iso > today ? 'future' : ''].filter(Boolean).join(' ');
    cells.push(`<div class="${cls}">${d}<span class="dot${done.has(iso) ? '' : ' none'}"></span></div>`);
  }
  const yearCount = [...trainedDays()].filter(d => d.startsWith(String(y))).length;
  const isCurrent = attMonthOffset === 0;
  return `<div class="att-head">
      <button class="att-nav" data-att-nav="-1" aria-label="Mes anterior">‹</button>
      <div class="att-title">${MONTH_NAMES[m]} ${y}</div>
      <button class="att-nav" data-att-nav="1" aria-label="Mes siguiente"${isCurrent ? ' disabled' : ''}>›</button>
    </div>
    <div class="att-stats">
      <div class="att-stat hi"><b>${done.size}</b><span>${isCurrent ? 'Este mes' : 'En el mes'}</span></div>
      <div class="att-stat"><b>${weekStreak()}</b><span>Sem. seguidas</span></div>
      <div class="att-stat"><b>${yearCount}</b><span>En ${y}</span></div>
    </div>
    <div class="att-grid">${['L','M','M','J','V','S','D'].map(d => `<div class="att-dow">${d}</div>`).join('')}${cells.join('')}</div>
    <div class="att-foot">${PREVIEW ? 'Vista previa: el alumno ve acá sus días entrenados.' : 'Cada punto rojo es un día que entrenaste.'}</div>`;
}

function fmtElapsed(ms){
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}

function updateTrainFab(){
  const pill = document.getElementById('train-pill');
  if(!pill) return;
  clearInterval(trainTimer);
  const ts = todaySession();
  pill.className = 'train-pill';
  pill.disabled = false;
  if(!ts){
    pill.innerHTML = '<span class="tp-icon">▶</span><span class="tp-text">Empezar entrenamiento<small>Suma el día a tu calendario</small></span>';
    pill.dataset.action = 'start';
  } else if(!ts.finished_at){
    const tick = () => { const el = pill.querySelector('.tp-time'); if(el) el.textContent = fmtElapsed(Date.now() - new Date(ts.started_at).getTime()); };
    pill.innerHTML = '<span class="tp-live"></span><span class="tp-text">Entrenando <span class="tp-time"></span><small>Día sumado al calendario</small></span><span class="tp-stop">Terminar</span>';
    pill.dataset.action = 'finish';
    tick();
    trainTimer = setInterval(tick, 1000);
  } else {
    const mins = Math.round((new Date(ts.finished_at) - new Date(ts.started_at)) / 60000);
    pill.className = 'train-pill done';
    pill.innerHTML = `<span class="tp-icon">✓</span><span class="tp-text">Entrenamiento de hoy listo<small>Duración: ${mins} min</small></span>`;
    pill.dataset.action = '';
  }
}

document.getElementById('train-pill').addEventListener('click', async (e) => {
  const pill = e.currentTarget;
  const action = pill.dataset.action;
  if(!action) return;
  if(PREVIEW){
    // En la vista previa del panel solo se simula, no se guarda nada.
    if(action === 'start') SESSIONS.unshift({ date: isoToday(), started_at: new Date().toISOString(), finished_at: null });
    else { const ts = todaySession(); if(ts) ts.finished_at = new Date().toISOString(); }
    refreshAttendance(); updateTrainFab();
    return;
  }
  if(!USER_ID) return;
  pill.disabled = true;
  if(action === 'start'){
    const todayKey = TODAY_KEYS[new Date().getDay()];
    const { error } = await sb.from('workout_sessions')
      .insert({ user_id: USER_ID, date: isoToday(), day_label: todayKey, started_at: new Date().toISOString() });
    if(error && error.code !== '23505'){ pill.disabled = false; alertSoft('No se pudo registrar, probá de nuevo.'); return; }
  } else {
    const ts = todaySession();
    if(ts?.id) await sb.from('workout_sessions').update({ finished_at: new Date().toISOString() }).eq('id', ts.id);
  }
  await loadSessions();
});

function alertSoft(msg){
  const pill = document.getElementById('train-pill');
  pill.innerHTML = `<span class="tp-text">${esc(msg)}</span>`;
  setTimeout(() => updateTrainFab(), 2500);
}

document.addEventListener('change', (e) => {
  if(e.target.matches('[data-heat-year]')){ heatYear = Number(e.target.value); refreshAttendance(); }
});

// Si la app queda abierta pasada la medianoche o vuelve del segundo plano, se actualiza el estado del día.
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') loadSessions(); });

// ---------- re-render conservando dónde estaba el alumno ----------
function captureView(){
  return {
    tab: document.querySelector('.tab-btn[data-tab].active')?.dataset.tab,
    days: [...document.querySelectorAll('.day-nav[data-days]')].map(n =>
      [...n.querySelectorAll('.day-btn')].findIndex(b => b.classList.contains('active'))),
    pday: document.querySelector('.pday-btn.active')?.dataset.pday,
    wk: document.querySelector('[data-wk-toggle]')?.classList.contains('on'),
    wkDefault: document.querySelector('[data-wk-toggle]')?.dataset.default,
    open: [...document.querySelectorAll('.meal')].map(m => m.classList.contains('open')),
    scroll: window.scrollY,
  };
}
function restoreView(v){
  if(!v) return;
  if(v.tab) document.querySelector(`.tab-btn[data-tab="${v.tab}"]`)?.click();
  const wk = document.querySelector('[data-wk-toggle]');
  // Se respeta lo que eligió el alumno solo si la semana sigue igual (si cambió, vale lo que corresponde por fecha).
  if(wk && v.wk !== undefined && v.wkDefault === wk.dataset.default && wk.classList.contains('on') !== v.wk) wk.click();
  const wkChanged = wk && v.wkDefault !== wk.dataset.default;
  document.querySelectorAll('.day-nav[data-days]').forEach((n, i) => {
    if(wkChanged && n.closest('#wk-box')) return;
    const btn = n.querySelectorAll('.day-btn')[v.days[i]];
    if(btn) btn.click();
  });
  if(v.pday !== undefined) document.querySelector(`.pday-btn[data-pday="${v.pday}"]`)?.click();
  document.querySelectorAll('.meal').forEach((m, i) => {
    if(v.open[i] !== undefined) m.classList.toggle('open', v.open[i]);
  });
  window.scrollTo({ top: v.scroll, behavior: 'instant' });
}

window.renderPlan = function(plan, student, payments){
  const view = rendered ? captureView() : null;
  PLAN = plan || {};
  STUDENT = student || STUDENT || {};
  PAYMENTS = payments || null;
  render();
  restoreView(view);
};

window.addEventListener('message', (e) => {
  if(e.origin !== location.origin) return;
  const d = e.data || {};
  if(d.type === 'cuatrouno:plan') window.renderPlan(d.plan, d.student, d.payments);
  if(d.type === 'cuatrouno:session' && d.access_token){
    sb.auth.setSession({ access_token: d.access_token, refresh_token: d.refresh_token })
      .then(({ data }) => { if(data?.session?.user?.id && !USER_ID){ USER_ID = data.session.user.id; loadSessions(); } });
  }
});

// Avisamos a la app principal que la plantilla está lista para recibir el plan.
try{ window.parent.postMessage({ type: 'cuatrouno:plan-ready' }, location.origin); }catch(e){}
</script>
